name: Build and Publish Container

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-push-docker-image:
    name: Build Docker image and push to repositories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # The Dockerfile and Singularity.def are committed, and
      # generate_images.sh pins neurodocker so regenerating them is
      # reproducible.  Regenerating here and comparing catches a
      # definition edited without the committed files being updated.
      - name: Check the committed container definitions are current
        run: |
          cp Dockerfile Dockerfile.committed
          cp Singularity.def Singularity.def.committed
          bash generate_images.sh both
          diff -u Dockerfile.committed Dockerfile
          diff -u Singularity.def.committed Singularity.def

      # setup Docker build action
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Github Packages
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and push to Docker Hub and GitHub Container Registry
        uses: docker/build-push-action@v2
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./
          # Note: tags and repository name have to be all lower-case
          tags: |
            peerherholz/repscreen:latest
            ghcr.io/peerherholz/repscreen:latest
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
